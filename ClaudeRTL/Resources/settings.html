<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
  :root {
    --accent: #D9774E;
    --accent-dark: #C15F3C;
    --bg: #171109;
    --card: #211E1C;
    --surface: #262220;
    --ink: #F3EEE2;
    --muted: #B1ADA1;
    --line: #3A3531;
    --code-bg: #1B1815;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans Arabic", -apple-system, "SF Arabic", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.7;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 28px 24px 32px; }
  .logo {
    font-size: 12px; font-weight: 700; letter-spacing: .4px;
    color: var(--accent); margin-bottom: 6px;
  }
  h1 { font-size: 22px; margin: 0 0 20px; font-weight: 700; }
  .section {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 14px;
    border-inline-start: 3px solid var(--accent-dark);
  }
  .section h2 { font-size: 14px; margin: 0 0 12px; font-weight: 700; }
  .radio { display: flex; flex-direction: column; gap: 8px; }
  .radio label {
    display: flex; align-items: center; gap: 10px;
    cursor: pointer; color: var(--ink);
  }
  .radio input { accent-color: var(--accent); width: 16px; height: 16px; }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line);
  }
  .list li:last-child { border-bottom: none; }
  .list .name { font-weight: 500; }
  .list .bid { font-size: 11px; color: var(--muted); direction: ltr; text-align: left; }
  .btn {
    font: inherit; border: none; border-radius: 8px; padding: 8px 14px;
    cursor: pointer; transition: .15s;
  }
  .btn-primary { background: var(--accent); color: #fff; font-weight: 600; }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-ghost {
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); font-size: 12px; padding: 4px 10px;
  }
  .btn-ghost:hover { background: var(--line); }
  .btn-row { margin-top: 10px; }
  .hidden { display: none !important; }
  .slider-row {
    display: flex; align-items: center; gap: 12px;
  }
  .slider-row input[type=range] {
    flex: 1; accent-color: var(--accent);
  }
  .slider-val { min-width: 42px; text-align: center; color: var(--accent); font-weight: 700; }
  .toggle-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .toggle-row input { accent-color: var(--accent); width: 18px; height: 18px; }
  .foot {
    margin-top: 8px; text-align: center; font-size: 12px; color: var(--muted);
    line-height: 1.8;
  }
  .foot a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .foot a:hover { text-decoration: underline; }
  .empty { color: var(--muted); font-size: 13px; padding: 6px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">Claude RTL</div>
  <h1>الإعدادات</h1>

  <div class="section">
    <h2>وضع التشغيل</h2>
    <div class="radio" id="modeRadios">
      <label><input type="radio" name="mode" value="allApps"> كل التطبيقات</label>
      <label><input type="radio" name="mode" value="claudeOnly"> Claude فقط</label>
      <label><input type="radio" name="mode" value="customList"> قائمة مخصّصة</label>
    </div>
  </div>

  <div class="section">
    <h2>التطبيقات المستثناة دائمًا</h2>
    <ul class="list" id="excludedList"></ul>
    <p class="empty hidden" id="excludedEmpty">لا توجد تطبيقات مستثناة.</p>
    <div class="btn-row">
      <button class="btn btn-primary" id="btnAddExcluded">إضافة تطبيق…</button>
    </div>
  </div>

  <div class="section hidden" id="includedSection">
    <h2>التطبيقات المسموح بها</h2>
    <ul class="list" id="includedList"></ul>
    <p class="empty hidden" id="includedEmpty">لا توجد تطبيقات في القائمة.</p>
    <div class="btn-row">
      <button class="btn btn-primary" id="btnAddIncluded">إضافة تطبيق…</button>
    </div>
  </div>

  <div class="section">
    <h2>المظهر</h2>
    <div class="slider-row">
      <span>حجم خط البابل</span>
      <input type="range" id="fontSlider" min="12" max="22" step="1">
      <span class="slider-val" id="fontVal">16</span>
    </div>
  </div>

  <div class="section">
    <h2>عام</h2>
    <div class="toggle-row">
      <span>تشغيل عند بدء النظام</span>
      <input type="checkbox" id="launchToggle">
    </div>
    <div class="btn-row" style="margin-top:14px">
      <button class="btn btn-primary" id="btnOnboarding">إعادة عرض الشرح</button>
    </div>
  </div>

  <div class="foot">
    الإصدار <span id="versionLabel">1.0.0</span> — <a href="#" id="grwLink">GRW Lab</a>
  </div>
</div>
<script>
  function bridge(msg) {
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.bridge)
      window.webkit.messageHandlers.bridge.postMessage(msg);
  }

  function renderAppList(ul, apps, removeAction) {
    ul.innerHTML = "";
    apps.forEach(function(app) {
      var li = document.createElement("li");
      var info = document.createElement("div");
      info.innerHTML = '<div class="name"></div><div class="bid"></div>';
      info.querySelector(".name").textContent = app.name;
      info.querySelector(".bid").textContent = app.bundleId;
      var btn = document.createElement("button");
      btn.className = "btn btn-ghost";
      btn.textContent = "إزالة";
      btn.onclick = function() { bridge({ action: removeAction, bundleId: app.bundleId }); };
      li.appendChild(info);
      li.appendChild(btn);
      ul.appendChild(li);
    });
  }

  window.loadSettings = function(data) {
    document.querySelectorAll('input[name="mode"]').forEach(function(r) {
      r.checked = r.value === data.mode;
    });
    document.getElementById("includedSection").classList.toggle("hidden", data.mode !== "customList");

    var excluded = data.excluded || [];
    var included = data.included || [];
    renderAppList(document.getElementById("excludedList"), excluded, "removeExcluded");
    document.getElementById("excludedEmpty").classList.toggle("hidden", excluded.length > 0);

    renderAppList(document.getElementById("includedList"), included, "removeIncluded");
    document.getElementById("includedEmpty").classList.toggle("hidden", included.length > 0);

    document.getElementById("fontSlider").value = data.fontSize;
    document.getElementById("fontVal").textContent = data.fontSize;
    document.getElementById("launchToggle").checked = !!data.launchAtLogin;
    document.getElementById("versionLabel").textContent = data.version;
  };

  document.querySelectorAll('input[name="mode"]').forEach(function(r) {
    r.onchange = function() {
      if (r.checked) bridge({ action: "setMode", mode: r.value });
    };
  });

  document.getElementById("btnAddExcluded").onclick = function() {
    bridge({ action: "addExcluded" });
  };
  document.getElementById("btnAddIncluded").onclick = function() {
    bridge({ action: "addIncluded" });
  };

  var fontTimer;
  document.getElementById("fontSlider").oninput = function() {
    var v = +this.value;
    document.getElementById("fontVal").textContent = v;
    clearTimeout(fontTimer);
    fontTimer = setTimeout(function() {
      bridge({ action: "setFontSize", size: v });
    }, 80);
  };

  document.getElementById("launchToggle").onchange = function() {
    bridge({ action: "setLaunchAtLogin", enabled: this.checked });
  };

  document.getElementById("btnOnboarding").onclick = function() {
    bridge({ action: "showOnboarding" });
  };

  document.getElementById("grwLink").onclick = function(e) {
    e.preventDefault();
    bridge({ action: "openWebsite" });
  };
</script>
</body>
</html>
