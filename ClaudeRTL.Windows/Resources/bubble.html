<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="fonts.css">
    <style>
        html[data-theme="dark"], :root {
            --accent: #D9774E;
            --accent-soft: #C15F3C;
            --bg: #171109;
            --card: #211E1C;
            --surface: #262220;
            --ink: #F3EEE2;
            --muted: #B1ADA1;
            --line: #3A3531;
            --code-bg: #1B1815;
            --shadow: 0 18px 50px rgba(0, 0, 0, .45), 0 3px 10px rgba(0, 0, 0, .3);
        }

        html[data-theme="light"] {
            --accent: #C15F3C;
            --accent-soft: #A84F2E;
            --bg: #F3EEE2;
            --card: #FFFFFF;
            --surface: #FAF9F5;
            --ink: #171109;
            --muted: #6B675F;
            --line: #E7E3D8;
            --code-bg: #F4F3EE;
            --shadow: 0 16px 40px rgba(23, 17, 9, .12), 0 2px 8px rgba(23, 17, 9, .08);
        }

        :root {
            --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0;
            height: 100%;
            background: transparent;
            overflow: hidden;
            pointer-events: none;
            font-family: "IBM Plex Sans Arabic", -apple-system, "SF Arabic", system-ui, sans-serif;
            color: var(--ink);
            transition: color .25s var(--ease);
        }

        .wrap {
            padding: 14px;
            width: max-content;
            max-width: calc(100vw - 4px);
            background: transparent;
            pointer-events: none;
        }

        .bubble {
            position: relative;
            width: max-content;
            max-width: 492px;
            pointer-events: auto;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: var(--shadow);
            opacity: 0;
            transform: translateY(4px) scale(.96);
            transition:
                opacity 160ms var(--ease),
                transform 160ms var(--ease),
                background-color .25s var(--ease),
                border-color .25s var(--ease),
                box-shadow .25s var(--ease);
        }

        .bubble.show {
            opacity: 1;
            transform: none
        }

        .bubble.hiding {
            opacity: 0;
            transform: translateY(4px) scale(.96);
            transition-duration: 120ms
        }

        .arrow {
            position: absolute;
            top: -6px;
            inset-inline-start: 34px;
            width: 13px;
            height: 13px;
            background: var(--card);
            border-inline-start: 1px solid var(--line);
            border-block-start: 1px solid var(--line);
            transform: rotate(45deg);
            border-radius: 4px 0 0 0;
            transition: background-color .25s var(--ease), border-color .25s var(--ease);
        }

        .arrow.bottom {
            top: auto;
            bottom: -6px;
            border-block-start: none;
            border-block-end: 1px solid var(--line);
            border-radius: 0 0 0 4px;
            transform: rotate(225deg)
        }

        .head {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 14px 9px;
            border-bottom: 1px solid var(--line);
            transition: border-color .25s var(--ease);
        }

        .brand {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .3px;
            color: var(--accent);
            margin-inline-start: auto;
            display: flex;
            align-items: center;
            gap: 6px
        }

        .brand .sp {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 6px color-mix(in srgb, var(--accent) 60%, transparent)
        }

        .ic {
            width: 26px;
            height: 26px;
            display: grid;
            place-items: center;
            border: none;
            background: transparent;
            color: var(--muted);
            border-radius: 8px;
            cursor: pointer;
            pointer-events: auto;
            -webkit-app-region: no-drag;
            transition:
                background-color 160ms var(--ease),
                color 160ms var(--ease),
                transform 160ms var(--ease);
        }

        .ic:hover {
            background: var(--surface);
            color: var(--ink);
            transform: scale(1.02);
        }

        .ic:active {
            transform: scale(0.98);
        }

        .ic.play:hover {
            color: var(--accent)
        }

        .ic svg {
            width: 15px;
            height: 15px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .body {
            position: relative;
            margin: 0 14px;
            padding: 11px 14px 12px;
            border-inline-start: 3px solid var(--accent);
            background: var(--surface);
            border-radius: 10px;
            max-height: calc(100vh - 118px);
            overflow-y: auto;
            font-size: 16px;
            line-height: 1.85;
            color: var(--ink);
            direction: rtl;
            text-align: start;
            unicode-bidi: embed;
            transition: background-color .25s var(--ease), color .25s var(--ease), border-color .25s var(--ease);
        }

        .body::-webkit-scrollbar {
            width: 8px
        }

        .body::-webkit-scrollbar-thumb {
            background: color-mix(in srgb, var(--line) 80%, var(--muted));
            border-radius: 8px
        }

        .body p,
        .body li,
        .body blockquote,
        .body h1,
        .body h2,
        .body h3,
        .body h4 {
            text-align: start;
            margin: .12em 0 .5em
        }

        .body h1,
        .body h2,
        .body h3,
        .body h4 {
            font-family: Georgia, "Times New Roman", serif
        }

        .body>:first-child {
            margin-top: 0
        }

        .body>:last-child {
            margin-bottom: 0
        }

        .body h1 {
            font-size: 1.32em
        }

        .body h2 {
            font-size: 1.18em
        }

        .body h3 {
            font-size: 1.07em
        }

        .body ul,
        .body ol {
            margin: .25em 0 .55em;
            padding-inline-start: 1.3em
        }

        .body li {
            margin: .12em 0
        }

        .body blockquote {
            border-inline-start: 3px solid var(--accent-soft);
            padding-inline-start: 11px;
            color: var(--muted)
        }

        .body a {
            color: var(--accent);
            text-decoration: none
        }

        .body hr {
            border: none;
            border-top: 1px solid var(--line);
            margin: .7em 0
        }

        .body strong {
            font-weight: 700
        }

        .body em {
            font-style: italic
        }

        .body code.inl {
            background: var(--code-bg);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 1px 6px;
            font-family: "IBM Plex Mono", "SF Mono", Menlo, monospace;
            font-size: .85em;
            direction: ltr;
            unicode-bidi: isolate
        }

        .body pre {
            direction: ltr;
            unicode-bidi: isolate;
            text-align: left;
            background: var(--code-bg);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 12px;
            overflow-x: auto;
            margin: .3em 0 .55em
        }

        .body pre code {
            font-family: "IBM Plex Mono", "SF Mono", Menlo, monospace;
            font-size: 13px;
            line-height: 1.55;
            white-space: pre;
            color: var(--ink)
        }

        .body .w.on {
            background: color-mix(in srgb, var(--accent) 26%, transparent);
            border-radius: 3px;
            box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 18%, transparent)
        }

        .foot {
            padding: 8px 10px 9px;
            text-align: center;
            font-size: 9.5px;
            line-height: 1.5;
            letter-spacing: .2px;
            color: var(--muted)
        }

        .foot b {
            color: var(--accent);
            font-weight: 700
        }

        .toast {
            position: absolute;
            bottom: 34px;
            inset-inline: 0;
            margin: auto;
            width: max-content;
            background: color-mix(in srgb, var(--ink) 88%, transparent);
            color: var(--card);
            font-size: 11.5px;
            padding: 5px 12px;
            border-radius: 8px;
            opacity: 0;
            transition: .2s;
            pointer-events: none
        }

        .toast.show {
            opacity: 1
        }

        .gear-wrap {
            position: relative
        }

        .gear-menu {
            position: absolute;
            top: calc(100% + 6px);
            inset-inline-start: 0;
            min-width: 190px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 10px;
            box-shadow: var(--shadow);
            padding: 6px;
            z-index: 20;
            display: none
        }

        .gear-menu.open {
            display: block
        }

        .gear-menu .gear-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            padding: 6px 8px 4px;
            border-bottom: 1px solid var(--line);
            margin-bottom: 4px
        }

        .gear-menu button {
            display: block;
            width: 100%;
            text-align: start;
            font: inherit;
            font-size: 12px;
            border: none;
            background: transparent;
            color: var(--ink);
            padding: 7px 8px;
            border-radius: 6px;
            cursor: pointer;
            pointer-events: auto;
        }

        .ic:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .gear-menu button:hover {
            background: color-mix(in srgb, var(--accent) 14%, transparent)
        }

        .gear-menu button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

    </style>
</head>

<body>
    <div class="wrap">
        <div class="bubble" id="bubble">
            <div class="arrow"></div>
            <div class="head">
                <button class="ic" id="bClose" title="اغلاق (Esc)"><svg viewBox="0 0 24 24">
                        <line x1="6" y1="6" x2="18" y2="18" />
                        <line x1="18" y1="6" x2="6" y2="18" /></svg></button>
                <button class="ic play" id="bPlay" title="استماع للنص">
                    <svg id="iconPlay" viewBox="0 0 24 24">
                        <path d="M11 5 6 9H2v6h4l5 4z" />
                        <path d="M15.5 8.5a5 5 0 0 1 0 7" />
                        <path d="M18.5 5.5a9 9 0 0 1 0 13" /></svg>
                    <svg id="iconPause" viewBox="0 0 24 24" style="display:none">
                        <rect x="6" y="5" width="4" height="14" rx="1" />
                        <rect x="14" y="5" width="4" height="14" rx="1" /></svg>
                </button>
                <div class="gear-wrap">
                    <button class="ic" id="bGear" title="إيقاف على التطبيق"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
                    <div class="gear-menu" id="gearMenu">
                        <div class="gear-title" id="gearTitle">إيقاف على …</div>
                        <button type="button" data-scope="session">هذه الجلسة</button>
                        <button type="button" data-scope="always">دائمًا</button>
                    </div>
                </div>
                <span class="brand"><span class="sp"></span>Claude RTL</span>
            </div>
            <div class="body" id="body"></div>
            <div class="foot" dir="ltr">by <b>GRW&nbsp;Lab</b> &mdash; grwlab.net</div>
        </div>
    </div>

    <script>
        var RAW = "",
            PLAIN = "",
            APP_NAME = "",
            APP_BUNDLE = "";

        // Reliable JS -> C# channel: queue actions; C# drains them via ExecuteScriptAsync.
        // postMessage is unreliable inside an AllowsTransparency WebView2 window, so we avoid it.
        window.__pendingActions = [];

        function sendToHost(msg) {
            window.__pendingActions.push(msg);
        }

        window.__drainActions = function() {
            var a = window.__pendingActions;
            window.__pendingActions = [];
            return a;
        };

        window.measureBubble = function() {
            var wrap = document.querySelector(".wrap");
            if (!wrap) return { w: 0, h: 0 };
            return { w: Math.ceil(wrap.scrollWidth), h: Math.ceil(wrap.scrollHeight) };
        };

        function bridge(msg) {
            sendToHost(msg);
        }

        window.setTheme = function(theme) {
            document.documentElement.setAttribute("data-theme", theme === "light" ? "light" : "dark");
            scheduleMeasureAndResize();
        };

        function scheduleMeasureAndResize() {
            var ready = document.fonts && document.fonts.ready ?
                document.fonts.ready :
                Promise.resolve();
            ready.then(function() {
                requestAnimationFrame(function() {
                    requestAnimationFrame(measureAndResize);
                });
            });
        }

        function measureAndResize() {
            var wrap = document.querySelector(".wrap");
            if (!wrap) return;
            var width = Math.ceil(wrap.scrollWidth);
            var height = Math.ceil(wrap.scrollHeight);
            sendToHost({
                action: "resize",
                width: width,
                height: height,
                w: width,
                h: height
            });
        }

        function esc(s) {
            return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        var ARABIC_RE = /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]/;

        function hasArabic(s) {
            return ARABIC_RE.test(s);
        }

        function stripTags(s) {
            return s.replace(/<[^>]+>/g, "");
        }

        /** فرض RTL عند وجود عربي — dir="auto" + plaintext يكسر السطر إذا بدأ بإنجليزي */
        function blockDirAttr(text) {
            return hasArabic(stripTags(text)) ? 'dir="rtl"' : 'dir="auto"';
        }

        function mdToHtml(src) {
            src = src.replace(/\r\n/g, "\n");
            var codes = [];
            src = src.replace(/```([\w+-]*)\n?([\s\S]*?)```/g, function(m, lang, code) {
                codes.push(code.replace(/\n$/, ""));
                return "@@C" + (codes.length - 1) + "@@";
            });
            src = esc(src);
            src = src.replace(/`([^`]+)`/g, function(m, c) {
                return '<code class="inl">' + c + "</code>";
            });
            src = src.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
            src = src.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
            src = src.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>');
            var lines = src.split("\n"),
                out = [],
                i = 0,
                list = null;

            function close() {
                if (list) {
                    out.push("</" + list + ">");
                    list = null;
                }
            }
            while (i < lines.length) {
                var ln = lines[i];
                var cm = ln.match(/^@@C(\d+)@@$/);
                if (cm) {
                    close();
                    out.push("<pre><code>" + esc(codes[+cm[1]]) + "</code></pre>");
                    i++;
                    continue;
                }
                var h = ln.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    close();
                    var l = h[1].length;
                    out.push("<h" + l + " " + blockDirAttr(h[2]) + ">" + h[2] + "</h" + l + ">");
                    i++;
                    continue;
                }
                if (/^\s*([-*+_]){3,}\s*$/.test(ln)) {
                    close();
                    out.push("<hr>");
                    i++;
                    continue;
                }
                if (/^\s*>\s?/.test(ln)) {
                    close();
                    var bq = ln.replace(/^\s*>\s?/, "");
                    out.push("<blockquote " + blockDirAttr(bq) + ">" + bq + "</blockquote>");
                    i++;
                    continue;
                }
                var ul = ln.match(/^\s*[-*+]\s+(.*)$/);
                if (ul) {
                    if (list !== "ul") {
                        close();
                        out.push('<ul dir="rtl">');
                        list = "ul";
                    }
                    out.push("<li " + blockDirAttr(ul[1]) + ">" + ul[1] + "</li>");
                    i++;
                    continue;
                }
                var ol = ln.match(/^\s*\d+[.)]\s+(.*)$/);
                if (ol) {
                    if (list !== "ol") {
                        close();
                        out.push('<ol dir="rtl">');
                        list = "ol";
                    }
                    out.push("<li " + blockDirAttr(ol[1]) + ">" + ol[1] + "</li>");
                    i++;
                    continue;
                }
                if (ln.trim() === "") {
                    close();
                    i++;
                    continue;
                }
                close();
                var buf = [ln];
                i++;
                while (i < lines.length && lines[i].trim() !== "" && !/^@@C\d+@@$/.test(lines[i]) &&
                    !/^(#{1,6})\s/.test(lines[i]) && !/^\s*[-*+]\s/.test(lines[i]) &&
                    !/^\s*\d+[.)]\s/.test(lines[i]) && !/^\s*>\s?/.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push("<p " + blockDirAttr(buf.join(" ")) + ">" + buf.join("<br>") + "</p>");
            }
            close();
            return out.join("");
        }

        function skipWrap(el) {
            return /^(PRE|CODE|SCRIPT|STYLE)$/i.test(el.tagName);
        }

        function wrapWordSpans(root) {
            var state = {
                i: 0
            };

            function walk(node) {
                if (node.nodeType === 3) {
                    var text = node.textContent;
                    if (!text) return;
                    var parts = text.split(/(\s+)/);
                    var frag = document.createDocumentFragment();
                    parts.forEach(function(p) {
                        if (!p) return;
                        if (/^\s+$/.test(p)) {
                            frag.appendChild(document.createTextNode(p));
                            state.i += p.length;
                        } else {
                            var span = document.createElement("span");
                            span.className = "w";
                            span.dataset.start = state.i;
                            span.textContent = p;
                            span.dataset.end = state.i + p.length;
                            state.i += p.length;
                            frag.appendChild(span);
                        }
                    });
                    node.parentNode.replaceChild(frag, node);
                    return;
                }
                if (node.nodeType === 1 && !skipWrap(node)) {
                    var kids = Array.prototype.slice.call(node.childNodes);
                    kids.forEach(walk);
                }
            }
            walk(root);
            return state.i;
        }

        function clearHighlight() {
            document.querySelectorAll(".body .w.on").forEach(function(el) {
                el.classList.remove("on");
            });
        }

        function highlightRange(loc, len) {
            clearHighlight();
            if (len <= 0) return;
            var end = loc + len;
            var first = null;
            document.querySelectorAll(".body .w").forEach(function(el) {
                var s = +el.dataset.start,
                    e = +el.dataset.end;
                if (s < end && e > loc) {
                    el.classList.add("on");
                    if (!first) first = el;
                }
            });
            if (first) first.scrollIntoView({
                block: "nearest",
                behavior: "smooth"
            });
        }
        window.highlightRange = highlightRange;
        window.clearHighlight = clearHighlight;

        window.setArrowBelow = function(arrowBelow) {
            var arrow = document.querySelector("#bubble .arrow");
            if (!arrow) return;
            if (arrowBelow) arrow.classList.add("bottom");
            else arrow.classList.remove("bottom");
        };

        function showBubble(text, fontSize, arrowBelow, appName, bundleId) {
            RAW = text;
            APP_NAME = appName || "";
            APP_BUNDLE = bundleId || "";
            document.getElementById("gearTitle").textContent = "إيقاف على " + (APP_NAME || "التطبيق");
            document.getElementById("gearMenu").classList.remove("open");
            clearHighlight();
            var body = document.getElementById("body");
            if (fontSize) body.style.fontSize = fontSize + "px";
            body.innerHTML = mdToHtml(text);
            wrapWordSpans(body);
            PLAIN = body.innerText.replace(/\u00a0/g, " ");
            body.scrollTop = 0;
            var bubble = document.getElementById("bubble");
            bubble.classList.remove("hiding");
            var arrow = bubble.querySelector(".arrow");
            if (arrowBelow) arrow.classList.add("bottom");
            else arrow.classList.remove("bottom");
            bubble.classList.remove("show");
            requestAnimationFrame(function() {
                bubble.classList.add("show");
                scheduleMeasureAndResize();
            });
            setSpeaking(false);
        }

        function setSpeaking(on) {
            document.getElementById("iconPlay").style.display = on ? "none" : "";
            document.getElementById("iconPause").style.display = on ? "" : "none";
            document.getElementById("bPlay").title = on ? "إيقاف" : "استماع للنص";
            if (!on) clearHighlight();
        }
        window.setSpeaking = setSpeaking;

        function hide() {
            clearHighlight();
            var bubble = document.getElementById("bubble");
            bubble.classList.add("hiding");
            bubble.classList.remove("show");
            setTimeout(function() {
                bubble.classList.remove("hiding");
                bridge({ action: "close" });
            }, 120);
        }
        document.getElementById("bClose").onclick = function(e) {
            e.preventDefault();
            e.stopPropagation();
            hide();
        };
        document.getElementById("bPlay").onclick = function(e) {
            e.preventDefault();
            e.stopPropagation();
            sendToHost({
                action: "speak",
                text: PLAIN || RAW
            });
        };
        document.getElementById("bGear").onclick = function(e) {
            e.preventDefault();
            e.stopPropagation();
            document.getElementById("gearMenu").classList.toggle("open");
        };
        document.querySelectorAll("#gearMenu button[data-scope]").forEach(function(btn) {
            btn.onclick = function(e) {
                e.preventDefault();
                e.stopPropagation();
                sendToHost({
                    action: "disableApp",
                    scope: btn.getAttribute("data-scope"),
                    process: APP_BUNDLE,
                    bundleId: APP_BUNDLE,
                    name: APP_NAME
                });
                document.getElementById("gearMenu").classList.remove("open");
            };
        });
        document.addEventListener("click", function(e) {
            if (e.target.closest(".gear-wrap")) return;
            document.getElementById("gearMenu").classList.remove("open");
        });
        document.addEventListener("keydown", function(e) {
            if (e.key === "Escape") hide();
        });
        window.showBubble = showBubble;
    </script>
</body>

</html>
