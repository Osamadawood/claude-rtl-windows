name: build-windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish
        working-directory: ClaudeRTL.Windows
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Verify Resources in publish output
        working-directory: ClaudeRTL.Windows
        run: |
          if (-not (Test-Path "publish\Resources\settings.html")) { throw "publish\Resources\settings.html missing" }
          if (-not (Test-Path "publish\Resources\bubble.html")) { throw "publish\Resources\bubble.html missing" }
          if (-not (Test-Path "publish\Resources\onboarding.html")) { throw "publish\Resources\onboarding.html missing" }
          if (-not (Test-Path "publish\Resources\fonts.css")) { throw "publish\Resources\fonts.css missing" }
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build installer
        working-directory: ClaudeRTL.Windows
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\ClaudeRTL.iss'
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeRTL-Windows
          path: |
            ClaudeRTL.Windows/publish/ClaudeRTL.exe
            ClaudeRTL.Windows/installer/Output/*.exe
